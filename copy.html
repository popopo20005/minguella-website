<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テキストコピー - Minguella</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 32px; max-width: 480px; width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,0.1); text-align: center; }
  .icon { font-size: 48px; margin-bottom: 16px; }
  .status { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 12px; }
  .hint { font-size: 14px; color: #888; margin-bottom: 24px; }
  .preview { background: #f8f8f8; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; text-align: left; white-space: pre-wrap; word-break: break-word; font-size: 13px; color: #444; max-height: 300px; overflow-y: auto; }
  .btn { display: inline-block; margin-top: 20px; padding: 12px 24px; background: #1da1f2; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; text-decoration: none; }
  .btn:hover { background: #0d8ecf; }
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">📋</div>
  <div class="status" id="status">コピー中...</div>
  <div class="hint" id="hint"></div>
  <div class="preview" id="preview"></div>
  <button class="btn" id="copyBtn" style="display:none" onclick="manualCopy()">もう一度コピー</button>
</div>
<script>
  function getText() {
    const hash = location.hash.slice(1);
    if (hash) {
      try { return decodeURIComponent(hash); } catch(e) {}
    }
    const params = new URLSearchParams(location.search);
    return params.get('text') || '';
  }

  const text = getText();
  const preview = document.getElementById('preview');
  const status = document.getElementById('status');
  const icon = document.getElementById('icon');
  const hint = document.getElementById('hint');
  const copyBtn = document.getElementById('copyBtn');

  preview.textContent = text;

  async function doCopy() {
    if (!text) {
      icon.textContent = '⚠️';
      status.textContent = 'テキストがありません';
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
      icon.textContent = '✅';
      status.textContent = 'コピーしました！';
      hint.textContent = '投稿先アプリに貼り付けてください';
      copyBtn.style.display = 'inline-block';
    } catch(e) {
      icon.textContent = '📋';
      status.textContent = '下のテキストを長押しでコピーしてください';
      hint.textContent = '自動コピーはブラウザの制限で使えませんでした';
      copyBtn.style.display = 'inline-block';
    }
  }

  function manualCopy() {
    navigator.clipboard.writeText(text).then(() => {
      icon.textContent = '✅';
      status.textContent = 'コピーしました！';
    });
  }

  doCopy();
</script>
</body>
</html>
